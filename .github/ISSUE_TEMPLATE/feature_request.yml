name: Feature request
description: Something the site or the journal-club workflow should do but doesn't.
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and where the site gets in the way.
      placeholder: Find every paper one author has suggested across the archive.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The feature or behaviour you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?

name: Documentation
description: Something in the setup guides, the README or the member guides is unclear or wrong.
labels: [documentation, needs triage]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: A file, page or section.
      placeholder: docs/SETUP.md, step 5
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or wrong?
    validations:
      required: true

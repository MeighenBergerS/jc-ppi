name: Bug report
description: Something on the site is broken or behaves wrongly.
labels: [bug, needs triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: The This Week page shows no papers, although I submitted one yesterday.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which page?
      placeholder: https://meighenbergers.github.io/jc-ppi/archive.html
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the browser's developer tools, then the Console tab, and paste any red errors.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 130 on Ubuntu 24.04

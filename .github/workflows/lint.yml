name: Lint

# Every pull request runs this, so it can be a required check. Checks the
# files the pre-commit hook formats.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.md"
      - ".prettierrc"
      - ".github/workflows/lint.yml"
  pull_request:

jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install --global prettier

      - name: Check formatting
        run: |
          prettier --check \
            "site/**/*.{html,css,js}" \
            "scripts/**/*.js" \
            "tests/**/*.{js,html}" \
            "**/*.md"

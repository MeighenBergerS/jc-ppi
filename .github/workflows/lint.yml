name: Lint

# Every pull request runs this, so it can be a required check. Checks the
# files the pre-commit hook formats, and that the docs site builds cleanly.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.md"
      - ".prettierrc"
      - ".prettierignore"
      - "docs/**"
      - "docs_theme/**"
      - "mkdocs.yml"
      - ".github/workflows/lint.yml"
  pull_request:

jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install --global prettier

      - name: Check formatting
        run: |
          prettier --check \
            "site/**/*.{html,css,js}" \
            "scripts/**/*.js" \
            "tests/**/*.{js,html}" \
            "**/*.md"

  docs:
    name: Docs build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # --strict fails on warnings, such as a broken link between pages.
      - name: Build the docs site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

name: Keep alive

# GitHub pauses scheduled workflows in a public repository after 60 days
# without repository activity, and issues and comments don't count. Once a
# week this checks the last commit on main; when it is 25 days old or more, it
# re-enables any paused workflow and pushes an empty commit, which counts as activity.

on:
  schedule:
    - cron: "37 9 * * 2" # Tuesdays
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if the last commit is recent"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    name: Keep scheduled workflows running
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the last commit and keep the repository active
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          MAX_AGE_DAYS: "25"
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit on main: $age days ago."
          if [ "$age" -lt "$MAX_AGE_DAYS" ] && [ "$FORCE" != "true" ]; then
            echo "Recent enough; nothing to do."
            exit 0
          fi
          # Re-enable workflows GitHub already paused for inactivity (not ones disabled by hand).
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' |
            while read -r id; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable" || true
            done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled workflows active" \
            -m "Automatic empty commit after $age days without one, so GitHub doesn't pause the scheduled workflows."
          git push

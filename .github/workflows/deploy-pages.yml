name: Deploy to GitHub Pages

# Only re-deploy when files that affect the site or the docs site change.
on:
  push:
    branches: [main]
    paths:
      - "site/*.html"
      - "site/assets/**"
      - "site/.nojekyll"
      - "scripts/papers/**"
      - "docs/**"
      - "docs_theme/**"
      - "mkdocs.yml"
  # The site's papers come from the paper issues (docs/MAINTAINING.md).
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    # Hourly, to pick up 👍 votes: reactions don't trigger workflows.
    - cron: "43 * * * *"
  workflow_dispatch: # allow manual deploys from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

# Only one deployment at a time; skip queued runs but don't cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    # Issue events: only paper issues. Imported issues are skipped so the bulk import
    # doesn't queue hundreds of deploys; the hourly run picks up their changes.
    if: >-
      github.event_name != 'issues' ||
      (contains(github.event.issue.labels.*.name, 'paper') &&
       !contains(github.event.issue.labels.*.name, 'imported'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # If this fails, the run stops and the previous deploy stays online.
      - name: Build the site data from the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/papers/build-csv.js site/data/papers.csv site/data/trending.csv

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # The documentation site, from docs/ into site/docs/ (mkdocs.yml).
      - name: Build the docs site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the site/ subfolder — GitHub Pages serves from here
          path: "site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: Check site

# Checks that the live site's pages load, that the last deploy built its
# data files from the issues, and that a deploy has run recently. Deploys
# run hourly; when they stop (e.g. a run stuck "waiting" holds the queue and
# every later deploy is cancelled, which counts as no failure), this fails
# and GitHub emails the maintainers.

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch: # allow manual runs

jobs:
  check-site:
    name: Verify the live site
    runs-on: ubuntu-latest

    steps:
      - name: Check site pages are reachable
        run: |
          BASE="https://meighenbergers.github.io/jc-ppi"
          for PAGE in "/" "/archive.html" "/stats.html" "/iowa.html" "/about.html" "/resources.html" "/docs/"; do
            URL="${BASE}${PAGE}"
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 30 --location "$URL")
            echo "$URL → HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "::error::$URL returned HTTP $HTTP_STATUS"
              exit 1
            fi
          done
          echo "OK — all site pages reachable."

      - name: Check the site data has papers
        run: |
          BASE="https://meighenbergers.github.io/jc-ppi/data"
          for FILE in papers.csv trending.csv; do
            ROWS=$(curl --silent --fail --max-time 30 "$BASE/$FILE" | wc -l) || ROWS=0
            echo "$FILE: $ROWS lines"
            if [ "$ROWS" -lt 2 ]; then
              echo "::error::$FILE is missing or has no rows. Check the latest Deploy to GitHub Pages run."
              exit 1
            fi
          done
          echo "OK — papers.csv and trending.csv have rows."

      - name: Check the site data is fresh
        run: |
          URL="https://meighenbergers.github.io/jc-ppi/data/papers.csv"
          MAX_HOURS=6
          MODIFIED=$(curl --silent --head --max-time 30 "$URL" \
            | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$MODIFIED" ]; then
            echo "::error::$URL has no Last-Modified header; is the site reachable?"
            exit 1
          fi
          AGE_HOURS=$(( ( $(date +%s) - $(date -d "$MODIFIED" +%s) ) / 3600 ))
          echo "papers.csv last deployed: $MODIFIED ($AGE_HOURS hours ago)"
          if [ "$AGE_HOURS" -ge "$MAX_HOURS" ]; then
            echo "::error::The site data is $AGE_HOURS hours old; deploys run hourly. Open Actions → Deploy to GitHub Pages: if a run is stuck \"waiting\" or \"in progress\", cancel it and the queued deploy will run."
            exit 1
          fi
          echo "OK — deployed within the last $MAX_HOURS hours."

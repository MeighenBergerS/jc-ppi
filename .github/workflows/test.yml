name: Tests

# Every pull request runs this, so it can be a required check.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "package.json"
      - "package-lock.json"
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
